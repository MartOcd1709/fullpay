# FullPay on Render, free plan: one web service + one Postgres database. ₹0, no card needed.
# The daily 10:00 IST reminder run and the keep-alive ping come from cron-job.org (free), calling
# POST /api/tick with the x-tick-secret header. For the Render Workflows bonus track, see render.paid.yaml.
services:
  - type: web
    name: fullpay-web
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm run start:render
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.22.1"
      - key: TZ
        value: Asia/Kolkata
      - key: DATABASE_URL
        fromDatabase:
          name: fullpay-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: TICK_SECRET
        generateValue: true
      - key: RESEED_SECRET
        generateValue: true
      - key: OWNER_PASSWORD
        sync: false
      - key: DEMO_MODE
        value: "1"
      - key: APP_URL
        sync: false
      - key: MAIL_TEST_MODE
        value: "1"
      - key: MAIL_TEST_TO
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_REPLY_TO
        sync: false
      - key: RESEND_API_KEY
        sync: false

databases:
  - name: fullpay-db
    plan: free
    region: singapore
    databaseName: fullpay
    user: fullpay
